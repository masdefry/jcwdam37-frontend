<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>CSS Position</title>
    <link
      rel="stylesheet"
      href="css-position.css"
    />
  </head>
  <body>
    <!-- 
        RELATIVE

        1. Akan berpindah terhadap posisi semula
        2. Ketika berpindah, akan meninggalkan celah kosong
        3. Untuk dapat menggunakan position relative, 
        diharuskan untuk menggunakan salah 1 property yaitu 
        top, right, bottom, left
    -->
    <div id="section-01">
      <div>Box-01</div>
      <div>Box-02</div>
      <div>Box-03</div>
    </div>

    <!-- 
        ABSOLUTE

        1. Akan berpindah terhadap parent nya 
        yg memiliki position non-static
        2. Ketika tidak ada parent yg memiliki position non-static, 
        akan berpindah terhadap viewport
        3. Ketika berpindah, tidak meninggalkan celah kosong
        4. Untuk dapat menggunakan position absolute, 
        diharuskan untuk menggunakan salah 1 property 
        yaitu top, right, bottom, left
    -->
    <div id="section-02">
      <div>Box-01</div>
      <div>Box-02</div>
      <div>Box-03</div>
    </div>

    <!-- 
        FIXED

        1. Relatif terhadap viewport
        2. Tidak akan berpindah meskipun user melakukan scroll
    -->
    <div
      id="navbar"
      class="secondary-bg-color primary-text-color"
    >
      Navbar
    </div>
