<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>DOM HTML</title>
  </head>
  <body>
    <h1 id="title">Original Heading Text</h1>
    <button id="btn-01">Change Title</button>
  </body>
</html>

<script>
  function ChangeText() {
    document.getElementById('title').innerText = 'New Heading Text';
  }

  let btn01 = document.getElementById('btn-01');
  btn01.addEventListener('click', ChangeText)
</script>
