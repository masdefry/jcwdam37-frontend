<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Flexbox</title>
    <link
      rel="stylesheet"
      href="flexbox.css"
    />
  </head>
  <body>
    <!-- 
        FLEXBOX

        1. Mengatur tata letak secara baris ATAU kolom
        2. Harus punya container dengan display: flex
        3. Property:
            - display           : flex
            - flex-direction    : Mengatur direction row/column
            - justify-content   : Mengatur item secara horizontal
            - align-items       : Mengatur item secara vertical
            - gap               : Mengatur jarak antar item
            - flex-wrap         : Wrap item (jika viewport tidak mencukupi, 
            akan buat baris baru dibawahnya)

    -->
    <div id="section-01">
      <div>Item-01</div>
      <div>Item-02</div>
      <div>Item-03</div>
    </div>
  </body>
</html>
